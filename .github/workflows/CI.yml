# Originally generated by maturin v1.8.3 (`maturin generate-ci github --pytest`), then edited:
# - aarch64 wheels are tested on native arm64 runners (job `arm64-native`) instead of QEMU
# - emulated architectures (armv7, ppc64le, s390x) only run the hardware independent tests
#   (`-m "not quality"`): quality tests run a fixed budget of evaluations (reproducible on any machine),
#   which takes too long under QEMU emulation
# - on pull requests, failures of emulated tests are reported but do not block
#
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install spyrrow --find-links dist --force-reinstall
          pip install pytest
          pip install pytest-xdist
          pytest -n auto
      - name: pytest (emulated, hardware independent tests only)
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'aarch64' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip pytest pytest-xdist
          run: |
            set -e
            pip3 install spyrrow --find-links dist --force-reinstall
            pytest -n auto -m "not quality"

  linux-ibm:
    runs-on: ${{ matrix.platform.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: s390x
            optional: true
          - runner: ubuntu-22.04
            target: ppc64le
            optional: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'ppc64' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip pytest
          run: |
            set -e
            pip3 install spyrrow --find-links dist --force-reinstall
            pytest -m "not quality"
  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ startsWith(matrix.platform.target, 'x86_64') }}
        uses: addnab/docker-run-action@v3
        with:
          image: alpine:latest
          options: -v ${{ github.workspace }}:/io -w /io
          run: |
            set -e
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install spyrrow --no-index --find-links dist --force-reinstall
            pip install pytest
            pip install pytest-xdist
            pytest -n auto
      - name: pytest (emulated, hardware independent tests only)
        if: ${{ !startsWith(matrix.platform.target, 'x86') && matrix.platform.target != 'aarch64' }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.platform.target }}
          distro: alpine_latest
          githubToken: ${{ github.token }}
          install: |
            apk add py3-virtualenv
          run: |
            set -e
            python3 -m virtualenv .venv
            source .venv/bin/activate
            pip install pytest
            pip install pytest-xdist
            pip install spyrrow --find-links dist --force-reinstall
            pytest -n auto -m "not quality"

  # aarch64 wheels are cross-compiled above, and tested here on native arm64 runners:
  # QEMU is too slow for the quality tests
  arm64-native:
    runs-on: ubuntu-24.04-arm
    needs: [linux, musllinux]
    strategy:
      fail-fast: false
      matrix:
        libc: [linux, musllinux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.libc }}-aarch64
          path: dist
      - uses: actions/setup-python@v5
        if: ${{ matrix.libc == 'linux' }}
        with:
          python-version: 3.x
      - name: pytest
        if: ${{ matrix.libc == 'linux' }}
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install spyrrow --find-links dist --force-reinstall
          pip install pytest
          pip install pytest-xdist
          pytest -n auto
      - name: pytest
        if: ${{ matrix.libc == 'musllinux' }}
        shell: bash
        run: |
          docker run --rm -v "${{ github.workspace }}:/io" -w /io alpine:latest sh -c '
            set -e
            apk add py3-pip py3-virtualenv
            python3 -m virtualenv .venv
            . .venv/bin/activate
            pip install spyrrow --no-index --find-links dist --force-reinstall
            pip install pytest
            pip install pytest-xdist
            pytest -n auto
          '

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
      - name: pytest
        if: ${{ !startsWith(matrix.platform.target, 'aarch64') }}
        shell: bash
        run: |
          set -e
          python3 -m venv .venv
          source .venv/Scripts/activate
          pip install spyrrow --find-links dist --force-reinstall
          pip install pytest
          pip install pytest-xdist[psutil]
          pytest -n auto

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
          - runner: macos-14

          - runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.runner }}
          path: dist
      - name: pytest
        run: |
          set -e
          python3 -m venv .venv
          source .venv/bin/activate
          pip install spyrrow --find-links dist --force-reinstall
          pip install pytest
          pip install pytest-xdist[psutil]
          pytest -n auto

  # spyrrow.pyi is generated from the Rust sources (scripts/generate_stubs.py), and the documentation is built
  # from them as on Read the Docs. Both are uploaded as artifacts. On pull requests from this repository, an out of
  # date spyrrow.pyi is regenerated and committed to the pull request; elsewhere (forks, main) the job fails.
  stubs-and-docs:
    runs-on: ubuntu-latest
    permissions:
      # push the regenerated spyrrow.pyi (pull requests from forks always get a read-only token)
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # on pull requests, the pull request branch itself rather than the merge commit, to be able to push to it
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # CI on a commit pushed with GITHUB_TOKEN waits for a maintainer approval: with SYNC_PR_TOKEN it runs directly
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate the type stubs
        run: |
          pip install "maturin>=1.15"
          python scripts/generate_stubs.py
      - name: Upload the type stubs
        uses: actions/upload-artifact@v4
        with:
          name: type-stubs
          path: spyrrow.pyi
      - name: Compare with the committed type stubs
        id: stubs
        run: |
          if git diff --quiet -- spyrrow.pyi; then
            echo "spyrrow.pyi is up to date"
          else
            git diff -- spyrrow.pyi
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the documentation (warnings are errors)
        run: |
          pip install sphinx
          MATURIN_PEP517_ARGS="--profile dev" pip install .
          python -m sphinx -W -b html docs docs/_build/html
      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
      - name: Commit the regenerated type stubs to the pull request
        if: steps.stubs.outputs.stale == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate spyrrow.pyi" -- spyrrow.pyi
          git push
          echo "::notice::The regenerated spyrrow.pyi was committed to the pull request"
      - name: Fail on out of date type stubs
        if: steps.stubs.outputs.stale == 'true'
        run: |
          echo "::error::spyrrow.pyi was out of date in this commit. On a pull request from this repository it was regenerated and committed (without SYNC_PR_TOKEN, CI on that commit waits for a maintainer to approve the run); otherwise commit the 'type-stubs' artifact, or run: python scripts/generate_stubs.py"
          exit 1

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist
  
  pre-release:
    name: Pre-Release
    runs-on: ubuntu-latest
    needs: [linux, musllinux, arm64-native, windows, macos, sdist]
    steps:
      - name: echo
        shell: bash
        run: |
          echo "All meaning full tests are done"

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, arm64-native, windows, macos, sdist]
    environment: pypi
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*

