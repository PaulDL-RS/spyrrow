[package]
name = "spyrrow"
version = "0.10.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "spyrrow"
crate-type = ["cdylib"]

[dependencies]
jagua-rs = { features = ["spp"], version = "=1.1.0" }
# jagua-rs = { git = "https://github.com/JeroenGar/jagua-rs.git", rev = "ba38bcae9ed3ab41a9e93a1894e2b01ea87c6619", features = [
#    "spp",
#] }
pyo3 = "0.29.3"
rand = "0.10"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sparrow = { git = "https://github.com/JeroenGar/sparrow.git", rev = "4629b22795ae6b25b3b460ccde6fb36a71292b6d", features = [
    "only_final_svg",
] }
num_cpus = "1.17.0"

[features]
# PyO3 introspection data, only needed to generate the type stubs (scripts/generate_stubs.py)
stubs = ["pyo3/experimental-inspect"]
